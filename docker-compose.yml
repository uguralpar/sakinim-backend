services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hello
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello -d hello"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/hello
      DATABASE_USERNAME: hello
      DATABASE_PASSWORD: hello
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
